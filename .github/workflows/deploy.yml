name: MLflow CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow gdown pandas numpy scikit-learn matplotlib joblib

      # Run MLflow project
      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      # Debug (sementara)
      - name: Show MLflow structure
        run: |
          ls -R MLProject/mlruns

      # Get latest run_id
      - name: Get latest run_id
        run: |
          RUN_ID=$(find MLProject/mlruns/0 -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort | tail -1 | xargs -r basename)
          
          if [ -z "$RUN_ID" ]; then
            echo "Error: No MLflow runs found"
            exit 1
          fi

          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest RUN_ID: $RUN_ID"

      # Build Docker image
      - name: Build Docker Model
        run: |
          cd MLProject

          mlflow models build-docker \
          -m "mlruns/0/$RUN_ID/artifacts/model" \
          -n model-training

      # Login Docker Hub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Tag image
      - name: Tag Docker Image
        run: |
          docker tag model-training \
          ${{ secrets.DOCKER_USERNAME }}/model-training:latest

      # Push image
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/model-training:latest