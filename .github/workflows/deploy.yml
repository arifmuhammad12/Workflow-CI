name: MLflow CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        pip install mlflow gdown

    - name: Run MLflow Project
      run: |
        cd MLProject
        mlflow run .

    - name: Get latest run_id
      run: |
        echo "RUN_ID=$(ls mlruns/0 | tail -1)" >> $GITHUB_ENV

    - name: Upload artifacts
      run: |
        python upload_drive.py

    - name: Build Docker image
      run: |
        cd MLProject
        mlflow models build-docker \
        -m mlruns/0/${{ env.RUN_ID }}/artifacts/model \
        -n model-training

    - name: Login DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker Image
      run: |
        docker tag model-training \
        arifmuhammadladuni/model-training:latest

        docker push \
        arifmuhammadladuni/model-training:latest