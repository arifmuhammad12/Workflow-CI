name: MLflow CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow gdown pandas numpy scikit-learn matplotlib joblib

      # Run MLflow project
      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      # Get latest MLflow run_id
      - name: Get latest run_id
        run: |
          RUN_ID=$(ls -td MLProject/mlruns/0/*/ | head -n 1 | cut -d'/' -f4)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest RUN_ID: $RUN_ID"

      # Build Docker image using MLflow
      - name: Build Docker Model
        run: |
          cd MLProject
          mlflow models build-docker \
          -m mlruns/0/${{ env.RUN_ID }}/artifacts/model \
          -n model-training

      # Login Docker Hub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag model-training \
          ${{ secrets.DOCKER_USERNAME }}/model-training:latest

      # Push Docker image
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/model-training:latest