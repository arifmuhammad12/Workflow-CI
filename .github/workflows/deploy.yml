name: MLflow CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow gdown pandas numpy scikit-learn matplotlib joblib

      # Run MLflow project
      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run . --env-manager=local
      
      - name: Upload MLflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: MLProject/mlruns

      # Debug (sementara)
      - name: Show MLflow structure
        run: |
          ls -R MLProject/mlruns

      # Get latest run_id
      - name: Show MLflow structure
        run: |
          ls -R MLProject/mlruns


      - name: Get model path
        run: |
          MODEL_PATH=$(find MLProject/mlruns -type d -path "*/artifacts" | head -n1)

          echo "MODEL_PATH=$MODEL_PATH" >> $GITHUB_ENV
          echo "Model path: $MODEL_PATH"

      # Build Docker image
      - name: Build Docker Model
        run: |
          mlflow models build-docker \
          -m "${{ env.MODEL_PATH }}" \
            -n model-training

      # Login Docker Hub
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Check Docker username
        run: |
          echo "Docker username exists: ${{ secrets.DOCKER_USERNAME != '' }}"

      # Tag image
      - name: Tag Docker Image
        run: |
          docker tag model-training \
          ${{ secrets.DOCKER_USERNAME }}/model-training:latest

      # Push image
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/model-training:latest